<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Ответы на отзывы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1c1c1e;
            --card-bg: #2c2c2e;
            --input-bg: #1c1c1e;
            --accent-color: #ff3366;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            margin: 0;
            box-sizing: border-box;
        }

        /* Заголовок */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-left: 5px;
        }

        /* Карточки как на скрине */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #3a3a3c;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .step-number {
            background-color: #3a3a3c;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        /* Поля ввода */
        input, textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid #3a3a3c;
            color: var(--text-main);
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        textarea {
            resize: none;
            height: 100px;
        }

        /* Розовые кнопки */
        .btn-primary {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-primary:active { opacity: 0.8; }
        .btn-primary:disabled { opacity: 0.5; }

        .btn-secondary {
            width: 100%;
            background-color: #3a3a3c;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 15px;
        }

        /* Блок результата */
        #result-container {
            display: none;
            margin-top: 15px;
        }

        .result-item {
            background-color: var(--input-bg);
            border: 1px solid #3a3a3c;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 15px;
            line-height: 1.4;
        }

        .footer-warning {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 20px;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        ✨ GenReply | Отзывы
    </div>

    <!-- Карточка 1 -->
    <div class="card">
        <div class="card-header">
            <div class="step-number">1</div>
            Данные товара
        </div>
        <input type="text" id="productUrl" placeholder="Ссылка на товар WB / Ozon">
        <button class="btn-secondary" onclick="scanReviews()" id="scanBtn">
            📥 Сканировать отзывы
        </button>
    </div>

    <!-- Карточка 2 -->
    <div class="card">
        <div class="card-header">
            <div class="step-number">2</div>
            Текст отзыва
        </div>
        <textarea id="reviewText" placeholder="Вставьте сюда отзыв клиента (или нажмите сканировать выше)..."></textarea>
        <button class="btn-primary" onclick="generateReply()" id="genBtn">
            Создать ответы 🤖
        </button>
    </div>

    <!-- Блок с результатом -->
    <div id="result-container">
        <div class="card">
            <div class="card-header">
                <div class="step-number">3</div>
                Варианты ответов
            </div>
            <div id="resultsList"></div>
        </div>
    </div>

    <div class="footer-warning">
        ⚠️ Внимание! ИИ может допускать ошибки. Обязательно проверяйте итоговый текст перед отправкой.
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Меняем цвет верхней панели Telegram под наш дизайн
        tg.setHeaderColor('#1c1c1e');
        tg.setBackgroundColor('#1c1c1e');

        async function scanReviews() {
            const url = document.getElementById('productUrl').value.trim();
            const btn = document.getElementById('scanBtn');
            
            if (!url) return tg.showAlert("Вставьте ссылку на товар!");

            btn.innerText = "Сканирую... ⏳";
            btn.disabled = true;

            try {
                // ЗАМЕНИ НА СВОЙ URL RENDER
                const response = await fetch('https://ТВОЯ-ССЫЛКА.onrender.com/scan_reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await response.json();
                
                if (data.status === 'ok') {
                    document.getElementById('reviewText').value = data.reviews[0]; 
                    tg.showAlert("Отзыв найден! Нажмите 'Создать ответы'.");
                } else {
                    tg.showAlert("Ошибка: " + data.message);
                }
            } catch (e) {
                tg.showAlert("Ошибка сети. Сервер спит.");
            } finally {
                btn.innerText = "📥 Сканировать отзывы";
                btn.disabled = false;
            }
        }

        async function generateReply() {
            const text = document.getElementById('reviewText').value.trim();
            const btn = document.getElementById('genBtn');
            const resultContainer = document.getElementById('result-container');
            const resultsList = document.getElementById('resultsList');
            
            if (!text) return tg.showAlert("Вставьте текст отзыва!");

            btn.innerText = "Генерирую... ⏳";
            btn.disabled = true;
            resultContainer.style.display = 'block';
            resultsList.innerHTML = '<div style="color: #8e8e93; text-align: center;">Нейросеть думает...</div>';

            try {
                // ЗАМЕНИ НА СВОЙ URL RENDER
                const response = await fetch('https://ТВОЯ-ССЫЛКА.onrender.com/generate_reply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ review_text: text })
                });
                const data = await response.json();
                
                if (data.status === 'ok') {
                    // Разбиваем ответ по переносам строк, чтобы сделать красивые блоки
                    const answers = data.reply.split('\n\n').filter(a => a.trim() !== '');
                    resultsList.innerHTML = answers.map(ans => 
                        `<div class="result-item">${ans}</div>`
                    ).join('');
                } else {
                    resultsList.innerHTML = `<div class="result-item" style="color: red;">Ошибка: ${data.message}</div>`;
                }
            } catch (error) {
                resultsList.innerHTML = `<div class="result-item" style="color: red;">Ошибка сети. Сервер недоступен.</div>`;
            } finally {
                btn.innerText = "Создать ответы 🤖";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
