<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GenDoc</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --card-bg: #2a2a2a; --text: #ffffff; --accent: #e83e8c; --border: #3f3f3f; }
        body { background-color: var(--bg-color); color: var(--text); font-family: sans-serif; margin: 0; padding: 16px; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        input { background-color: #111; border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 8px;}
        .row { display: flex; gap: 8px; }
        .btn-submit { background-color: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <h3>Создание документа</h3>
    
    <div class="card">
        <p>Услуга 1</p>
        <input type="text" id="name" placeholder="Наименование (Транспортировка)" value="Транспортировка">
        <div class="row">
            <input type="text" id="unit" placeholder="Ед. (рейс)" value="рейс" style="width: 40%;">
            <input type="number" id="qty" placeholder="Кол-во" value="1" style="width: 25%;">
            <input type="number" id="price" placeholder="Цена" value="10000" style="width: 35%;">
        </div>
    </div>

    <button class="btn-submit" onclick="createDoc()">Создать PDF 📄</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function createDoc() {
            // Собираем данные
            const data = {
                type: 'КП',
                items: [{
                    name: document.getElementById('name').value,
                    unit: document.getElementById('unit').value,
                    qty: document.getElementById('qty').value,
                    price: document.getElementById('price').value
                }]
            };

            tg.MainButton.showProgress(); // Показываем загрузку в ТГ

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    // Получаем файл в виде блоба и скачиваем
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "document.pdf";
                    a.click();
                    tg.showAlert("Документ успешно создан!");
                } else {
                    tg.showAlert("Ошибка сервера");
                }
            } catch (error) {
                tg.showAlert("Ошибка: " + error.message);
            } finally {
                tg.MainButton.hideProgress();
            }
        }
    </script>
</body>
</html>
